name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AjkerShironam.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AjkerShironam-apk
          path: AjkerShironam.apk
          retention-days: 30

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: আজকের শিরোনাম v${{ github.run_number }}
          files: AjkerShironam.apk
          make_latest: true
